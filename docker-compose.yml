services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: research_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_password}
      POSTGRES_DB: ${POSTGRES_DB:-research_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research_user} -d ${POSTGRES_DB:-research_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
