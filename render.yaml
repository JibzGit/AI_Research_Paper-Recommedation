# Render Blueprint for the AI Research Intelligence Platform.
#
# Defines ONLY the static site (Vite frontend). The FastAPI backend no
# longer runs on Render -- it moved to Google Cloud Run
# (https://ai-research-api-vecbq5svfq-uw.a.run.app) after Render's free
# web-service plan's 512MB memory limit proved insufficient to load
# BAAI/bge-base-en-v1.5. No `databases:` block: the production database is
# an external Neon PostgreSQL (free tier), not a Render-managed Postgres
# instance, because Render's own free Postgres plan auto-deletes 30 days
# after creation.
#
# autoDeploy is off until a deployment has been manually validated
# end-to-end; flip to `true` afterward if continuous deployment from
# `main` is wanted.

services:
  - type: web
    name: ai-research-platform
    runtime: static
    branch: main
    autoDeploy: false
    rootDir: frontend
    buildCommand: npm ci && npm run build
    # staticPublishPath is relative to rootDir when rootDir is set --
    # confirmed by the actual Render deploy failure this fixed
    # ("Publish directory frontend/dist does not exist", since rootDir:
    # frontend made frontend/dist resolve to frontend/frontend/dist).
    staticPublishPath: dist
    envVars:
      # The deployed FastAPI service's exact https:// URL. Build-time only
      # (Vite inlines it into the bundle) -- set manually in the Render
      # dashboard once the backend's URL is known, then trigger a rebuild.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
